- aid: honeybadger:webhooks
  name: Honeybadger Outbound Webhook Notifications
  description: >-
    Outbound webhook notification surface delivered by Honeybadger to subscriber URLs configured via Project
    Settings > Alerts & Integrations. Covers the generic Webhook integration's documented event types
    (occurred, resolved, unresolved, assigned, commented, rate_exceeded, deployed, check_in_missing, check_in_reporting,
    down, up, cert_will_expire) plus the Slack and Microsoft Teams chat-platform delivery channels.
  humanURL: https://docs.honeybadger.io/guides/integrations/webhook/
