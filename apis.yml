- aid: honeybadger:reporting-api
  name: Honeybadger Reporting API
  description: >-
    Ingestion API for submitting exceptions, deploys, check-ins, source maps, and events from instrumented
    applications to Honeybadger. Uses a Project API Key as the authentication credential and accepts JSON
    payloads over HTTPS.
  humanURL: https://docs.honeybadger.io/api/
  baseURL: https://api.honeybadger.io/v1
